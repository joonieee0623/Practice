<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch post</title>
</head>
<body>
    <script>
        //declare function fetch(input: RequestInfo | URL, init?: RequestInit): Promise<Response>;
        //(1) 방식1 ( then(), catch(), finally() )
        const f = () => {
            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                body: JSON.stringify({title:'리액트', userId:1}),
                headers: {'Content-type':'application/json;charset=UTF-8'}
            })
            .then(response => response.json())
            .then(jsObj => {
                console.log('jsObj', jsObj)
                //document.getElementById('result').innerText = jsObj.title
                document.getElementById('result').innerText = JSON.stringify(jsObj)
            })
        }

        //(2) 방식2 ( async/await ) -> 미션

    </script>
    <button type="button" onclick="f()">요청(request)</button>
    <div id="result"></div>
</body>
</html>

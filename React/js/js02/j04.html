<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template literal</title>
</head>
<body>
    <script>
        const f1 = () => {
            console.log('ES5의 방식 \n줄바꿈 \\n사용')
            console.log(`템플릿 리터럴
줄바꿈 공백문자    \\n그대로 사용`)  //Template literal 이용
        }

        const f2 = () => {
            let a = 1
            let b = 2
            // console.log(typeof(a))
            console.log('합은 '+(a+b)+'이다')
            console.log(`합은 ${a+b}이다`) //Template literal 이용
        }
        const f3 = () => {
            const temp = `'작은 따옴표' "큰 따옴표"` //Template literal 이용
            console.log(temp)
        }
    </script>
    <button onclick="f1()">버튼1</button>
    <button onclick="f2()">버튼2</button>
    <button onclick="f3()">버튼3</button>
</body>
</html>

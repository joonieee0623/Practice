<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Django Board</title>
	
		<style>
			a{text-decoration:none}
		</style>
	</head>

<body>
<center>
	<font color='gray' size='4' face='휴먼편지체'>
	<hr width='600' size='2' color='gray' noshade>
	<h3>Django Board</h3>
	<font color='gray' size='4' face='휴먼편지체'>
	<a href="{% url 'board_write' %}">글쓰기</a>
	</font>
	<hr width='600' size='2' color='gray' noshade>
	</font>
	
	<table border='2' width='600' align='center' noshade>
	<tr><td width='20%' align='center'>No</td>
	<td>{{ board.id }}</td>
	</tr>
	<tr>
	<td width='20%' align='center'>Writer</td>
	<td>{{ board.writer }}</td>
	</tr>
	<tr>
	<td align='center'>E-mail</td>
	<td>{{ board.email }}</td>
	</tr>
	<tr>
	<td align='center'>Subject</td>
	<td>{{ board.subject }}</td>
	</tr>
	<tr>
	<td align='center'>Contents</td>
	<td>{{ board.content|linebreaks }}</td>
	</tr>
	</table>
	<p></p>
	<hr width='600' size='2' color='gray' noshade>
	<font color='gray' size='4' face='휴먼편지체'>
	<a href="{% url 'board_update' board.id %}">수정</a>
	 &nbsp;&nbsp;| 
	<a href="{% url 'board_delete' board.id %}" onclick="return confirm('삭제하시겠습니까?')">삭제</a>
	 &nbsp;&nbsp;| 
	<a href="{% url 'board_list' %}">목록</a>
	</font>
	<hr width='600' size='2' color='gray' noshade>
</center>
	
</body>
</html>
